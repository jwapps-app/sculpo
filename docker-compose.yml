# Local/dev full stack. Host ports avoid 5432/5433/8000 (taken on this Mac),
# and bind to loopback: the database has a known password and the API is
# reachable without nginx, neither of which belongs on the LAN.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      ADMIN_USERS: ${ADMIN_USERS:-john}
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:80"
    depends_on:
      - api

volumes:
  db-data:
