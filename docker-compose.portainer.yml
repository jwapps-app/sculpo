# NAS stack (Portainer, Repository deploy). Image-only — CI builds, the NAS
# pulls. Env vars are supplied in Portainer's UI; nothing lives on the host.
services:
  db:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - /volume1/docker/sculpo/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # IMAGE_TAG defaults to latest; set it to a sha-<commit> tag (CI publishes
    # one per push) to pin a known-good pair of images.
    image: ${IMAGE_PREFIX:-ghcr.io/jwapps-app/sculpo}-api:${IMAGE_TAG:-latest}
    # Two uvicorn workers, each of which buffers a whole project on save.
    mem_limit: 768m
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/app
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERS: ${ADMIN_USERS}
      # Must be supplied when registering an admin username. Without it,
      # whoever reaches a public instance first can claim the admin name —
      # so the API refuses to start with it empty unless ALLOW_OPEN_ADMIN_SIGNUP
      # says the instance is on a trusted network.
      ADMIN_SIGNUP_SECRET: ${ADMIN_SIGNUP_SECRET:-}
      ALLOW_OPEN_ADMIN_SIGNUP: ${ALLOW_OPEN_ADMIN_SIGNUP:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/jwapps-app/sculpo}-web:${IMAGE_TAG:-latest}
    mem_limit: 128m
    environment:
      # Proxies whose forwarded client address nginx believes, as CIDRs
      # (the cloudflared container's network, say). Empty: nobody's.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${APP_PORT:-8220}:80"
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - /volume1/docker/sculpo/backups:/backups
    # pg_dump runs on its own first so its exit status is what gets checked —
    # in a pipeline only gzip's would be. A failed dump used to leave an
    # empty archive behind and then prune the good ones anyway.
    entrypoint: >
      sh -c 'while true; do
        if pg_dump -h db -U app -Fc app > /tmp/dump.tmp; then
          gzip -c /tmp/dump.tmp > /backups/app-$$(date +%Y%m%d).dump.gz
            && find /backups -name "app-*.dump.gz" -mtime +14 -delete;
        else
          echo "pg_dump failed; keeping existing backups" >&2;
        fi;
        rm -f /tmp/dump.tmp;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

  # Off-site copy of the nightly dumps. Opt-in: start the stack with
  # COMPOSE_PROFILES=offsite and set RCLONE_REMOTE (e.g. "b2:sculpo-backups"),
  # with an rclone.conf for that remote at /volume1/docker/sculpo/rclone/.
  # `sync` mirrors the local folder, so the remote keeps the same 14 days.
  offsite:
    image: rclone/rclone:1
    profiles: ["offsite"]
    mem_limit: 128m
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - /volume1/docker/sculpo/backups:/backups:ro
      - /volume1/docker/sculpo/rclone:/config/rclone:ro
    entrypoint: >
      sh -c 'if [ -z "$$RCLONE_REMOTE" ]; then
        echo "RCLONE_REMOTE is not set; nothing to sync to" >&2; exit 1; fi;
      while true; do
        rclone sync /backups "$$RCLONE_REMOTE" --config /config/rclone/rclone.conf
          || echo "off-site sync failed" >&2;
        sleep 86400;
      done'
