name: Build and publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Nothing reaches the registry until this passes. Images used to publish on
  # every push with the test suite never run, so a regression shipped as
  # :latest and was found by whoever redeployed next.
  test:
    runs-on: ubuntu-latest
    services:
      # The suite runs twice: on SQLite, as it does on a laptop, and on the
      # PostgreSQL production uses — the only place row locks, real
      # concurrency and the migrations' SQL mean what they claim.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend tests (SQLite)
        working-directory: ./backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q
      - name: Backend tests (PostgreSQL)
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Frontend typecheck, lint, tests and build
        working-directory: ./pwa
        run: |
          npm ci
          npx tsc -b
          npm run lint
          npm test
          npm run build

  build:
    needs: test
    # Only pushes publish; a pull request is tested and stops there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: web
            context: .
            dockerfile: ./pwa/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
