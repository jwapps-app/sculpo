# Security headers, kept in one file and re-included in EVERY location that
# sets any header of its own.
#
# nginx's add_header does not merge across levels: a location containing even
# one add_header discards every header inherited from the server block. The
# cache-control and asset locations below each set one, which silently dropped
# all of these — including on the app shell itself, since try_files routes /
# through the index.html location.
#
# connect-src allows arbitrary https/wss so the packaged iPad app (and any
# self-hosted browser install) can be pointed at a Sculpo server on another
# origin; the API is protected by bearer tokens, not by CSP.
#
# script-src needs 'wasm-unsafe-eval': the import decimator (meshoptimizer) is
# WebAssembly, and compiling any WASM counts as eval unless it is granted.
# Falling back to default-src 'self' silently broke mesh import — the browser
# refuses WebAssembly.instantiate() with a CompileError. 'wasm-unsafe-eval' is
# the narrow grant for exactly this; it does NOT re-enable eval() on strings,
# which is what 'unsafe-eval' would have done.
# Browsers only honour HSTS over HTTPS, so this is inert on a plain-HTTP
# LAN hit and takes effect where it matters: forwarded through Cloudflare
# (or any TLS terminator) to the public hostname. No includeSubDomains —
# this sits on a subdomain and must not make promises for its siblings.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
