# Per-IP limits for the auth endpoints. The app throttles per username, which
# cannot stop someone cycling novel usernames — each attempt still costs a
# full bcrypt on the server. This bounds that by source address.
#
# Which address: behind the Cloudflare Tunnel every request arrives from
# cloudflared, so the socket address would lump all users together, and the
# real client address is in CF-Connecting-IP. But anyone can send that
# header, so it is believed only when the request came from a proxy the
# operator listed in TRUSTED_PROXY_CIDRS (rendered into trusted-proxies.geo
# at startup; empty means believe nobody). From anywhere else the socket
# address is used, and a forged header changes nothing. The app is handed
# the result as X-Real-IP and reads nothing else.
geo $sculpo_from_proxy {
    default 0;
    include /etc/nginx/trusted-proxies.geo;
}
map "$sculpo_from_proxy:$http_cf_connecting_ip" $sculpo_client_ip {
    default             $remote_addr;
    "~^1:(?<cf>.+)$"    $cf;
}
limit_req_zone $sculpo_client_ip zone=sculpo_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the app's own ceiling (max_project_bytes + framing), so the
    # edge sheds oversized uploads instead of the app paying to parse them.
    client_max_body_size 52m;

    # Don't advertise the nginx version.
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.conf;

    location /api/v1/auth/ {
        include /etc/nginx/conf.d/security-headers.conf;
        # Small burst for legitimate retries, then throttle.
        limit_req zone=sculpo_auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $sculpo_client_ip;
        # Never forwarded: the app must not be able to believe them.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    # Readiness is unauthenticated and opens a database connection — exactly
    # the pair that lets a stranger drain the pool. Same per-IP budget as auth.
    location = /api/v1/health/ready {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=sculpo_auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $sculpo_client_ip;
        # Never forwarded: the app must not be able to believe them.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $sculpo_client_ip;
        # Never forwarded: the app must not be able to believe them.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and service worker must never be cached by HTTP — they
    # are how updates propagate. Each of these sets a header, so each must
    # re-include the security headers or it loses them all.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /registerSW.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
