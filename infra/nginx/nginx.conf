# Per-IP limits for the auth endpoints. The app throttles per username, which
# cannot stop someone cycling novel usernames — each attempt still costs a
# full bcrypt on the server. This bounds that by source address.
#
# Behind the Cloudflare Tunnel every request arrives from cloudflared, so the
# socket address would lump all users together; prefer the real client address
# it forwards. On a direct LAN connection there is no such header and the
# socket address is used. (A LAN client could forge the header to get its own
# bucket — acceptable: it is already inside, and the per-username throttle
# still applies.)
map $http_cf_connecting_ip $sculpo_client_ip {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $sculpo_client_ip zone=sculpo_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the app's own ceiling (max_project_bytes + framing), so the
    # edge sheds oversized uploads instead of the app paying to parse them.
    client_max_body_size 52m;

    # Don't advertise the nginx version.
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.conf;

    location /api/v1/auth/ {
        include /etc/nginx/conf.d/security-headers.conf;
        # Small burst for legitimate retries, then throttle.
        limit_req zone=sculpo_auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Behind the tunnel the socket peer is always Cloudflare; pass the real
        # client address through for the app's throttling.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and service worker must never be cached by HTTP — they
    # are how updates propagate. Each of these sets a header, so each must
    # re-include the security headers or it loses them all.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /registerSW.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
